<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>注册新账号</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>注册新账号</h1>

    <div class="box">
        <h3>填写注册信息</h3>
        <input type="text" id="reg-username" placeholder="用户名">
        <input type="password" id="reg-password" placeholder="密码">
        <input type="email" id="reg-email" placeholder="邮箱">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="verify-code" placeholder="6位验证码" style="flex: 1;">
            <button onclick="sendCode()" id="send-code-btn" style="width: 120px; margin: 5px 0;">获取验证码</button>
        </div>
        <button onclick="register()" style="background-color: #28a745; margin-top: 10px;">注 册</button>
        
        <p id="auth-msg" style="color: red; text-align: center;"></p>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <p style="text-align: center;">
            已有账号？ <a href="index.html" style="color: #007bff; font-weight: bold; text-decoration: none;">返回登录</a>
        </p>
    </div>

    <!-- 注册页专属的 JS -->
    <script src="register.js"></script>
</body>
</html>
